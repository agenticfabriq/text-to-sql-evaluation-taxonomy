# Mirrors every push to the GitLab copy at gitlab.com/agentic-fabriq/text-to-sql-evaluation-taxonomy.
# Needs the GITLAB_MIRROR_TOKEN repository secret (a GitLab token with write_repository).
name: mirror to GitLab
on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: push
        env:
          TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          git push --mirror "https://oauth2:${TOKEN}@gitlab.com/agentic-fabriq/text-to-sql-evaluation-taxonomy.git"
