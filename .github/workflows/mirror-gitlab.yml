# Mirrors every push to the GitLab copy at gitlab.com/agentic-fabriq/text-to-sql-evaluation-taxonomy.
# Needs the GITLAB_MIRROR_TOKEN repository secret (a GitLab token with write_repository).
name: mirror to GitLab
on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: push
        env:
          TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          # Branches and tags only: --mirror would also push the checkout's
          # origin/* tracking refs, which GitLab rejects as hidden refs.
          git push --prune "https://oauth2:${TOKEN}@gitlab.com/agentic-fabriq/text-to-sql-evaluation-taxonomy.git" \
            "+refs/remotes/origin/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
